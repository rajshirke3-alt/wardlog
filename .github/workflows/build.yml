name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK licenses (safety net)
        # GitHub's ubuntu-latest runners ship with the Android SDK
        # pre-installed and licenses pre-accepted, but this makes the build
        # resilient even if that ever changes, instead of failing outright.
        run: |
          SDK_DIR="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          CMDTOOLS="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$CMDTOOLS" ]; then
            yes | "$CMDTOOLS" --licenses > /dev/null || true
          else
            echo "cmdline-tools not found at expected path — relying on preinstalled SDK/licenses."
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --warning-mode all

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: WardLog-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload build logs (only if the build failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-failure-logs
          path: |
            **/build/reports/**
            **/*.log
          if-no-files-found: ignore
